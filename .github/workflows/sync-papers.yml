name: Sync papers metadata

# When a PDF is added to assets/papers/ on main, scaffold a stub entry in
# _data/papers.yml so there's a ready-to-fill template (title/authors/date/
# description) for it. The /papers/ page already lists every PDF regardless,
# so this is a convenience step, not a requirement.
#
# This runs separately from the deploy workflow on purpose: deploy needs only
# read access, while this needs contents:write to commit the stubs back. The
# commit is made with the default GITHUB_TOKEN, which by design does NOT trigger
# further workflow runs — so it neither loops here nor fires a redundant deploy.
# That's fine: the PDF itself is already deployed by the original push, and the
# stub holds only TODO placeholders until a human edits them.

on:
  push:
    branches: [main]
    paths:
      - "assets/papers/**"
  workflow_dispatch:

permissions:
  contents: write

# Don't pile up runs if several PDFs land in quick succession.
concurrency:
  group: sync-papers
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Scaffold missing papers.yml entries
        run: ruby script/sync_papers.rb

      - name: Commit stubs if any were added
        run: |
          if [ -n "$(git status --porcelain _data/papers.yml)" ]; then
            git config user.name  "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add _data/papers.yml
            git commit -m "chore(papers): scaffold metadata stubs for new PDFs"
            git push
          else
            echo "No new papers.yml stubs to commit."
          fi
